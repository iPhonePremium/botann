<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>かっこいいボタン</title>

<style>
    body {
        background: #050505;
        color: white;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
    }

    button {
        padding: 15px 35px;
        font-size: 20px;
        color: white;
        background: transparent;
        border: 2px solid #00ffff;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 0 15px #00ffff;
    }

    button:hover {
        background: #00ffff;
        color: black;
        box-shadow: 0 0 30px #00ffff;
    }

    #text {
        position: absolute;
        top: 60%;
        font-size: 40px;
        font-weight: bold;
        opacity: 0;
        transform: scale(0.5);
        text-shadow:
            0 0 10px #00ffff,
            0 0 30px #0088ff;
    }

    .show {
        animation: appear 1s forwards;
    }

    @keyframes appear {
        0% {
            opacity: 0;
            transform: scale(0.5) rotate(-5deg);
            filter: blur(10px);
        }

        50% {
            opacity: 1;
            transform: scale(1.2) rotate(2deg);
            filter: blur(0);
        }

        100% {
            opacity: 1;
            transform: scale(1) rotate(0);
        }
    }
</style>
</head>

<body>

<button onclick="showText()">CLICK</button>

<div id="text">おまえはばかか！</div>

<script>
function showText() {
    const text = document.getElementById("text");

    text.classList.remove("show");

    // アニメーションを再起動
    void text.offsetWidth;

    text.classList.add("show");
}
</script>

</body>
</html>
