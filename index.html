<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cool Text Animation</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;

        background:
            radial-gradient(circle at center, #111 0%, #000 70%);

        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* ボタン */
    #startButton,
    #resetButton {
        position: absolute;
        padding: 18px 50px;

        font-size: 24px;
        font-weight: bold;
        letter-spacing: 5px;

        color: white;
        background: rgba(0, 0, 0, 0.5);

        border: 2px solid #00ffff;
        border-radius: 8px;

        cursor: pointer;

        box-shadow:
            0 0 10px #00ffff,
            0 0 30px #00ffff;

        transition: 0.3s;
        z-index: 10;
    }

    #startButton:hover,
    #resetButton:hover {
        transform: scale(1.1);

        background: #00ffff;
        color: black;

        box-shadow:
            0 0 20px #00ffff,
            0 0 60px #00ffff,
            0 0 100px #00ffff;
    }

    /* 最初はRESETを隠す */
    #resetButton {
        display: none;
        bottom: 40px;
        font-size: 16px;
        padding: 12px 30px;
    }

    /* メイン文字 */
    #text {
        position: absolute;

        font-size: clamp(60px, 12vw, 180px);
        font-weight: 900;

        letter-spacing: 15px;
        text-align: center;

        opacity: 0;

        transform:
            scale(0.2)
            rotateX(90deg);

        filter: blur(30px);

        color: white;

        text-shadow:
            0 0 5px white,
            0 0 15px #00ffff,
            0 0 40px #00ffff,
            0 0 80px #0088ff;

        pointer-events: none;
    }

    /* 出現 */
    .show {
        animation: epicAppear 1.5s cubic-bezier(.17,.67,.2,1.3) forwards;
    }

    @keyframes epicAppear {

        0% {
            opacity: 0;

            transform:
                scale(0.2)
                rotateX(90deg)
                translateY(100px);

            filter: blur(30px);

            letter-spacing: 80px;
        }

        30% {
            opacity: 1;

            transform:
                scale(1.3)
                rotateX(0deg)
                translateY(-20px);

            filter: blur(0);

            letter-spacing: 20px;
        }

        55% {
            transform:
                scale(0.9)
                rotateX(0deg)
                translateY(10px);

            text-shadow:
                0 0 10px white,
                0 0 30px #00ffff,
                0 0 80px #00ffff,
                0 0 150px #0088ff;
        }

        75% {
            transform:
                scale(1.08)
                rotateX(0deg)
                translateY(-5px);
        }

        100% {
            opacity: 1;

            transform:
                scale(1)
                rotateX(0deg)
                translateY(0);

            filter: blur(0);

            letter-spacing: 15px;
        }
    }

    /* 画面フラッシュ */
    #flash {
        position: fixed;
        inset: 0;

        background: white;

        opacity: 0;
        pointer-events: none;

        z-index: 20;
    }

    .flash {
        animation: flash 0.25s;
    }

    @keyframes flash {
        0% {
            opacity: 0.8;
        }

        100% {
            opacity: 0;
        }
    }

    /* RESET時 */
    .hide {
        animation: disappear 0.5s forwards;
    }

    @keyframes disappear {
        to {
            opacity: 0;
            transform: scale(2);
            filter: blur(20px);
        }
    }
</style>
</head>

<body>

<button id="startButton" onclick="showText()">
    CLICK
</button>

<div id="text">
    おまえは！<br>ばかだぁ！
</div>

<div id="flash"></div>

<button id="resetButton" onclick="resetPage()">
    RESET
</button>

<script>

function showText() {

    const button = document.getElementById("startButton");
    const text = document.getElementById("text");
    const reset = document.getElementById("resetButton");
    const flash = document.getElementById("flash");

    // CLICKボタンを消す
    button.style.display = "none";

    // 文字を表示
    text.classList.remove("show");
    void text.offsetWidth;
    text.classList.add("show");

    // 画面を一瞬フラッシュ
    flash.classList.remove("flash");
    void flash.offsetWidth;
    flash.classList.add("flash");

    // RESETボタンを表示
    setTimeout(() => {
        reset.style.display = "block";
    }, 1000);
}


function resetPage() {

    const button = document.getElementById("startButton");
    const text = document.getElementById("text");
    const reset = document.getElementById("resetButton");

    // 文字を消す
    text.classList.remove("show");
    text.classList.add("hide");

    setTimeout(() => {

        text.classList.remove("hide");

        // CLICKボタンを復活
        button.style.display = "block";

        // RESETを消す
        reset.style.display = "none";

    }, 500);
}

</script>

</body>
</html>
