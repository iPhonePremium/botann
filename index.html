<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHUPAAN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background: #000;
    color: white;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* CLICK */
#startButton {
    padding: 16px 45px;

    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;

    color: white;
    background: #050505;

    border: 2px solid #00ffff;
    border-radius: 8px;

    cursor: pointer;

    box-shadow: 0 0 12px #00ffff;

    transition: transform .15s, background .15s;
}

#startButton:hover {
    transform: scale(1.08);
    background: #00ffff;
    color: #000;
}

/* 巨大文字 */
#text {
    position: absolute;

    width: 100%;

    text-align: center;

    font-size: clamp(70px, 14vw, 220px);
    font-weight: 900;
    line-height: .9;

    letter-spacing: 10px;

    opacity: 0;

    transform: scaleX(3) scaleY(.3);

    color: white;

    text-shadow:
        0 0 8px #00ffff,
        0 0 25px #00ffff;

    will-change: transform, opacity;
}

/* シュパーン！！ */
.show {
    animation: shupaan .45s cubic-bezier(.15,.8,.25,1) forwards;
}

@keyframes shupaan {

    0% {
        opacity: 0;

        transform:
            translateX(-100vw)
            scaleX(3)
            scaleY(.3);
    }

    35% {
        opacity: 1;

        transform:
            translateX(25px)
            scaleX(1.05)
            scaleY(1.05);
    }

    55% {
        transform:
            translateX(-10px)
            scaleX(.98)
            scaleY(1.02);
    }

    75% {
        transform:
            translateX(4px)
            scaleX(1.01)
            scaleY(.99);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scaleX(1)
            scaleY(1);
    }
}

/* RESET */
#resetButton {
    display: none;

    position: absolute;
    bottom: 30px;

    padding: 10px 25px;

    background: transparent;
    color: #aaa;

    border: 1px solid #555;
    border-radius: 5px;

    cursor: pointer;
}

#resetButton:hover {
    color: white;
    border-color: white;
}
</style>
</head>

<body>

<button id="startButton" onclick="showText()">
    CLICK
</button>

<div id="text">
    お前は！<br>ばーーか！
</div>

<button id="resetButton" onclick="resetPage()">
    RESET
</button>

<script>

const startButton = document.getElementById("startButton");
const text = document.getElementById("text");
const resetButton = document.getElementById("resetButton");

function showText() {

    // CLICKを消す
    startButton.style.display = "none";

    // アニメーションをリセット
    text.classList.remove("show");

    void text.offsetWidth;

    // シュパーン！！
    text.classList.add("show");

    // RESET表示
    setTimeout(() => {
        resetButton.style.display = "block";
    }, 500);
}

function resetPage() {

    text.classList.remove("show");

    resetButton.style.display = "none";

    startButton.style.display = "block";
}

</script>

</body>
</html>
